# Per-agent LLM configuration for the eval pipeline.
# Each [section] is one LLM role. Set its endpoint, model, and prompt independently.
#
# base_url  = ""  -> Anthropic default endpoint (must be an Anthropic-compatible endpoint).
# api_key_env     -> name of the env var holding this agent's key (falls back to ANTHROPIC_API_KEY),
#                    so secrets stay in the environment, not this file.
# prompt          -> path to the agent's system prompt (swap the file to change the prompt).
# mode            -> auto (LLM iff a key is available) | llm | offline

# provider: "anthropic" (base_url "" + claude-* model) or "openai" (OpenAI-compatible).
#
# All roles run on the bank's Alfa Sandbox API (AlfaGen) — see "4. Sandbox API.pdf" and
# Alfa_LLM_endpoints.png: POST {base_url}/chat/completions. Sandbox rules encoded below:
#   - key: UUID issued by email → .env SANDBOX_API_KEY (Bearer); access lasts 3 months
#   - headers: systemid = "sanduser" (406 without it); unique messageid per request (oai.py)
#   - rate limit 0.2 RPS → `rps = 0.2` throttles all calls to the endpoint (shared slots)
#   - network: VPN/VDI only — off-network use the offline path (*_MODE=offline) or another endpoint
# Models available now (A/B via env, e.g. RESOLUTION_MODEL=...):
#   Qwen/Qwen3.6-35B-A3B-FP8   (newest, recommended judge; multimodal)
#   Qwen/QwQ-32B               (reasoning)  ·  Qwen/Qwen3-Coder-Next  ·  gpt-oss-120b  ·  /models/llama-3.3
#   Tools (function calling) are documented ONLY for: Qwen/QwQ-32B, /models/llama-3.3, gpt-oss-120b.
# Coming soon: Qwen/Qwen3.5-122B-A10B-FP8, google/gemma-4-26B-A4B-it, deepseek-ai/DeepSeek-V4-Flash

[agent]                            # the support agent under test (Agent X)
mode = "auto"
provider = "openai"
base_url = "https://agenapisandbox.moscow.alfaintra.net/internal/llm/v1"
api_key_env = "SANDBOX_API_KEY"
system_id = "sanduser"
rps = 0.2
model = "gpt-oss-120b"             # needs MCPClear/getInstruction tool calls — tools are documented
                                   # for QwQ-32B / llama-3.3 / gpt-oss-120b only; if your production
                                   # agent runs Qwen3.6-35B, switch back and verify tool calls work
prompt = "agent_prompt_v2.md"      # verbatim production prompt (prompts/agent.md is the derived alt)
effort = "medium"

[groundedness]                     # knowledge-grounding judge (no tools needed)
mode = "auto"
provider = "openai"
base_url = "https://agenapisandbox.moscow.alfaintra.net/internal/llm/v1"
api_key_env = "SANDBOX_API_KEY"
system_id = "sanduser"
rps = 0.2
model = "Qwen/Qwen3.6-35B-A3B-FP8"
prompt = "prompts/groundedness.md"
effort = "medium"

[resolution]                       # resolution judge (examiner; no tools needed)
mode = "auto"
provider = "openai"
base_url = "https://agenapisandbox.moscow.alfaintra.net/internal/llm/v1"
api_key_env = "SANDBOX_API_KEY"
system_id = "sanduser"
rps = 0.2
model = "Qwen/Qwen3.6-35B-A3B-FP8"
prompt = "prompts/resolution.md"
effort = "medium"

# Panel voting ("trial"): the resolution verdict is a majority vote of these judges — any
# 2 of 3 agree → that verdict; a full yes/partial/no split → "partial" (ordinal median).
# Each [[resolution.panel]] entry inherits [resolution] and overrides fields (prompt, model, ...).
# The judges run at temperature 0, so identical prompts would vote identically — diversity
# comes from the personas (or point panelists at different models for a mixed bench).
# NOTE: at the Sandbox 0.2 RPS limit the panel triples wall-clock (one call per 5 s, shared);
# measured A/B showed the single judge ≥ panel on kappa, so for Sandbox runs prefer
# RESOLUTION_PANEL=off (or comment these entries out).
[[resolution.panel]]
name = "judge"                     # neutral examiner — same prompt as the single judge
prompt = "prompts/resolution.md"

[[resolution.panel]]
name = "prosecutor"                # hunts for real flaws before voting
prompt = "prompts/resolution_prosecutor.md"

[[resolution.panel]]
name = "defender"                  # credits what the hint got right before voting
prompt = "prompts/resolution_defender.md"

[mcp]                              # transaction tool backend (MCPClear)
mode = "fixture"                   # fixture | live
transport = "stdio"                # stdio | http
server_url = ""
command = ""
tool_name = "get_transactions"
auth_token = ""

[pipeline]
concurrency = 6                    # calibrate fan-out
